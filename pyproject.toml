[project]
name = "ai-employee"
version = "0.1.0"
description = "Local AI Employee System V3.0 - Multi-agent orchestrator with hierarchical memory, RAG, MCP tools, and self-improvement."
authors = [
    {name = "xservices-git", email = "xs@xservices.dev"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",

    # DB
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "aiosqlite>=0.20.0",

    # Vector
    "chromadb>=0.5.20",

    # LLM
    "ollama>=0.4.0",
    "httpx>=0.27.2",

    # MCP
    "mcp>=1.0.0",

    # Observability
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "prometheus-client>=0.21.0",

    # Utilities
    "tenacity>=9.0.0",
    "aiofiles>=24.1.0",
    "orjson>=3.10.7",
    "python-dotenv>=1.0.1",
    "typer>=0.12.5",
    "rich>=13.9.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.1",
    "httpx>=0.27.2",  # for TestClient
]
eval = [
    "datasets>=3.1.0",
    "pandas>=2.2.3",
]

[project.scripts]
ai-employee = "core.common.cli:main"
ai-employee-eval = "eval.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "api", "eval"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=core --cov=api --cov-report=term-missing"

[tool.coverage.run]
source = ["core", "api"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
