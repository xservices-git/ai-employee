version: "3.8"

services:
  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    container_name: ai-employee-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:////data/ai-employee.db
      - CHROMA_PATH=/data/chroma
      - OLLAMA_URL=http://ollama:11434
      - LOG_LEVEL=INFO
    volumes:
      - data:/data
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    container_name: ai-employee-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      - api
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ai-employee-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    # Uncomment for GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped

  mcp-data-processing:
    build:
      context: ..
      dockerfile: infra/docker/mcp.Dockerfile
    container_name: ai-employee-mcp-data
    command: ["python", "-m", "mcp_servers.data_processing.server"]
    environment:
      - DATABASE_URL=sqlite:////data/ai-employee.db
    volumes:
      - data:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ai-employee-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: ai-employee-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  data:
  ollama:
  grafana:
