openapi: 3.0.3
info:
  title: AI Employee API
  version: 1.0.0
  description: |
    REST API cho AI Employee local (1 orchestrator).
    OpenAPI 3.0, moi endpoint co risk level va approval requirement.
  contact:
    name: xservices-git
    url: https://github.com/xservices-git/ai-employee
  license:
    name: MIT

servers:
  - url: http://localhost:8000
    description: Dev local
  - url: https://ai-employee.example.com
    description: Production

tags:
  - name: tasks
    description: Task lifecycle
  - name: approvals
    description: Approval workflow
  - name: memory
    description: Memory access
  - name: rules
    description: Procedural rules (YAML-backed)
  - name: eval
    description: Eval harness
  - name: health
    description: Health + metrics
  - name: auth
    description: Authentication + user management
  - name: domains
    description: Domain configuration

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [ok, degraded, down]}
                  version: {type: string}
                  uptime_sec: {type: integer}

  /metrics:
    get:
      tags: [health]
      summary: Prometheus metrics
      responses:
        '200':
          description: Metrics
          content:
            text/plain:
              schema: {type: string}

  /v1/auth/register:
    post:
      tags: [auth]
      summary: Register user (first user becomes admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password]
              properties:
                email: {type: string}
                name: {type: string}
                password: {type: string, minLength: 8}
                role: {type: string, enum: [admin, approver, user], default: user}
      responses:
        "201":
          description: User + JWT
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: {$ref: "#/components/schemas/User"}
                  token: {type: string}
  /v1/auth/login:
    post:
      tags: [auth]
      summary: Login with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string}
                password: {type: string}
      responses:
        "200":
          description: User + JWT
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: {$ref: "#/components/schemas/User"}
                  token: {type: string}
  /v1/auth/me:
    get:
      tags: [auth]
      summary: Current user
      parameters:
        - {in: header, name: Authorization, required: true, schema: {type: string}}
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
  /v1/auth/users:
    get:
      tags: [auth]
      summary: List users (admin only)
      parameters:
        - {in: header, name: Authorization, required: true, schema: {type: string}}
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/User"}}
  /v1/auth/audit:
    get:
      tags: [auth]
      summary: Audit log (admin only)
      parameters:
        - {in: header, name: Authorization, required: true, schema: {type: string}}
        - {in: query, name: actor, schema: {type: string}}
        - {in: query, name: action, schema: {type: string}}
        - {in: query, name: limit, schema: {type: integer, default: 100}}
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/AuditEntry"}}
  /v1/domains:
    get:
      tags: [domains]
      summary: List available domains
      responses:
        "200":
          description: Domain list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {type: string}}
  /v1/domains/{domain}:
    get:
      tags: [domains]
      summary: Get domain config + rules
      parameters:
        - {in: path, name: domain, required: true, schema: {type: string}}
      responses:
        "200":
          description: Domain details
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain: {type: string}
                  rules: {type: array, items: {type: object}}
                  config: {type: object}
                  rule_count: {type: integer}

  /v1/tasks:
    post:
      tags: [tasks]
      summary: Tao task moi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input: {type: string, description: Raw user message}
                domain: {type: string}
                user_id: {type: string}
                priority: {type: integer, minimum: 1, maximum: 5, default: 3}
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '429': {$ref: '#/components/responses/RateLimited'}
    get:
      tags: [tasks]
      summary: List tasks
      parameters:
        - {in: query, name: status, schema: {type: string, enum: [pending, running, waiting_approval, completed, failed]}}
        - {in: query, name: domain, schema: {type: string}}
        - {in: query, name: limit, schema: {type: integer, default: 50}}
        - {in: query, name: offset, schema: {type: integer, default: 0}}
      responses:
        '200':
          description: List tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Task'}
                  total: {type: integer}

  /v1/tasks/{task_id}:
    get:
      tags: [tasks]
      summary: Get task detail
      parameters:
        - {in: path, name: task_id, required: true, schema: {type: string}}
      responses:
        '200':
          description: Task
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
    delete:
      tags: [tasks]
      summary: Cancel task
      parameters:
        - {in: path, name: task_id, required: true, schema: {type: string}}
      responses:
        '204':
          description: Cancelled

  /v1/tasks/{task_id}/trace:
    get:
      tags: [tasks]
      summary: Get execution trace
      parameters:
        - {in: path, name: task_id, required: true, schema: {type: string}}
      responses:
        '200':
          description: Trace spans
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Span'}

  /v1/tasks/{task_id}/feedback:
    post:
      tags: [tasks]
      summary: Submit feedback
      parameters:
        - {in: path, name: task_id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score: {type: integer, minimum: 1, maximum: 5}
                notes: {type: string}
                corrections: {type: object}
      responses:
        '201':
          description: Feedback recorded

  /v1/approvals:
    get:
      tags: [approvals]
      summary: List pending approvals
      parameters:
        - {in: query, name: status, schema: {type: string, enum: [pending, approved, rejected, modified], default: pending}}
      responses:
        '200':
          description: Approval list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ApprovalRequest'}

  /v1/approvals/{approval_id}/decide:
    post:
      tags: [approvals]
      summary: Approve/reject/modify
      parameters:
        - {in: path, name: approval_id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [approved, rejected, modified]}
                modified_args: {type: object}
                feedback: {type: string}
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalRequest'}

  /v1/memory/search:
    post:
      tags: [memory]
      summary: Search memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, collection]
              properties:
                query: {type: string}
                collection: {type: string, enum: [episodic, semantic, approval_history]}
                top_k: {type: integer, default: 5}
                filters: {type: object}
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: {$ref: '#/components/schemas/MemoryChunk'}

  /v1/rules:
    get:
      tags: [rules]
      summary: List procedural rules
      parameters:
        - {in: query, name: domain, schema: {type: string}}
        - {in: query, name: status, schema: {type: string, enum: [active, shadow, disabled]}}
      responses:
        '200':
          description: List rules (from YAML + metadata from DB)
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Rule'}
    post:
      tags: [rules]
      summary: Tao rule moi (manual hoac proposed)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RuleCreate'}
      responses:
        '201':
          description: Rule created (status=pending)
    patch:
      tags: [rules]
      summary: Approve/reject/promote rule (HUMAN GATE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule_id, action]
              properties:
                rule_id: {type: string}
                action: {type: string, enum: [approve, reject, promote, demote]}
                feedback: {type: string}
      responses:
        '200':
          description: Rule updated

  /v1/eval/run:
    post:
      tags: [eval]
      summary: Chay eval suite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: {type: string}
                ci_mode: {type: boolean, default: false}
                fail_on_regression: {type: boolean, default: true}
      responses:
        '202':
          description: Eval started
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvalRun'}

components:
  responses:
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}

  schemas:
    User:
      type: object
      properties:
        id: {type: string}
        email: {type: string}
        name: {type: string}
        role: {type: string, enum: [admin, approver, user]}
        created_at: {type: string, format: date-time}
    AuditEntry:
      type: object
      properties:
        id: {type: integer}
        ts: {type: string, format: date-time}
        trace_id: {type: string}
        actor: {type: string}
        action: {type: string}
        result: {type: string}
        confidence: {type: number}
        metadata: {type: object}

    Error:
      type: object
      properties:
        code: {type: string}
        message: {type: string}

    Task:
      type: object
      properties:
        id: {type: string}
        task_type: {type: string, enum: [data_processing, content_generation, classification_routing, monitoring_alerting, research_summarization, scheduling_coordination, decision_support]}
        domain: {type: string}
        status: {type: string, enum: [pending, running, waiting_approval, completed, failed, cancelled]}
        priority: {type: integer}
        input_data: {type: object}
        plan: {type: object}
        result: {type: object}
        confidence: {type: number, minimum: 0, maximum: 1}
        trace_id: {type: string}
        created_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}

    Span:
      type: object
      properties:
        trace_id: {type: string}
        span_id: {type: string}
        parent_span_id: {type: string}
        name: {type: string}
        start_time: {type: string, format: date-time}
        end_time: {type: string, format: date-time}
        duration_ms: {type: number}
        attributes: {type: object}
        status: {type: string, enum: [ok, error]}

    ApprovalRequest:
      type: object
      properties:
        id: {type: string}
        task_id: {type: string}
        proposal: {type: object}
        risk_level: {type: string, enum: [low, medium, high, critical]}
        reason: {type: string}
        decision: {type: string, enum: [pending, approved, rejected, modified]}
        decided_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}

    MemoryChunk:
      type: object
      properties:
        id: {type: string}
        text: {type: string}
        metadata: {type: object}
        score: {type: number}
        collection: {type: string}

    Rule:
      type: object
      properties:
        id: {type: string}
        domain: {type: string}
        trigger_keywords: {type: array, items: {type: string}}
        action: {type: string}
        example: {type: string}
        success_rate: {type: number}
        sample_size: {type: integer}
        status: {type: string, enum: [active, shadow, disabled, pending]}
        source: {type: string, enum: [manual, learned]}
        created_at: {type: string, format: date-time}

    RuleCreate:
      type: object
      required: [domain, trigger_keywords, action]
      properties:
        domain: {type: string}
        trigger_keywords: {type: array, items: {type: string}}
        action: {type: string}
        example: {type: string}
        source: {type: string, enum: [manual, learned], default: manual}

    EvalRun:
      type: object
      properties:
        id: {type: string}
        domain: {type: string}
        status: {type: string, enum: [running, completed, failed]}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        total_cases: {type: integer}
        passed: {type: integer}
        failed: {type: integer}
